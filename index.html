<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Loop</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #080b12;
            color: #f0f4ff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            width: 100%;
        }

        #root {
            height: 100vh;
            width: 100vw;
        }

        .game-shell {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: stretch;
            justify-content: center;
            background: radial-gradient(circle at top, #0c1424 0%, #080b12 60%);
        }

        .game-shell__viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
        }

        .game-shell__canvas-host {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-shell__overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            pointer-events: none;
        }

        .game-shell__button {
            pointer-events: auto;
            background: rgba(16, 27, 49, 0.78);
            color: #f4f7ff;
            border: 1px solid rgba(104, 196, 255, 0.45);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 13px;
            cursor: pointer;
            transition: background 160ms ease;
        }

        .game-shell__button:hover {
            background: rgba(56, 80, 128, 0.86);
        }

        .game-shell__hint {
            pointer-events: none;
            background: rgba(15, 21, 38, 0.6);
            border-radius: 999px;
            padding: 6px 12px;
            font-family: monospace;
            font-size: 12px;
            color: #9fb8ff;
        }

        canvas {
            image-rendering: pixelated;
            border: 1px solid #1f2840;
            box-shadow: 0 0 32px rgba(23, 77, 136, 0.45);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js" crossorigin="anonymous"></script>
    <script type="module" src="./src/reactApp.js"></script>
</body>
</html>
